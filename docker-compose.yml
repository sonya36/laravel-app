services:
  nginx: 
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-app
    volumes:
      - ./src:/var/www
    depends_on:
      - mysql-db

  mysql-db: 
    image: mysql:8.0
    container_name: laravel-db
    environment:
      MYSQL_DATABASE: mysqldb
      MYSQL_USER: dbuser1
      MYSQL_PASSWORD: pass123
      MYSQL_ROOT_PASSWORD: passroot123
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
